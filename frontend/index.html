<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7fb" />
    <title>davamly — Habit tracker</title>
    <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar" aria-label="Main navigation">
        <a href="#habits" class="wordmark" aria-label="davamly home">
          <img src="assets/logo.png" alt="" width="2000" height="2000" />
        </a>
        <div class="nav-links" id="nav-links">
          <a class="btn nav-link" data-page="habits" href="#habits">
            <i class="fa-solid fa-table-cells" aria-hidden="true"></i>
            <span>Habits</span>
          </a>
          <a class="btn nav-link" data-page="activity" href="#activity">
            <i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i>
            <span>Activity</span>
          </a>
          <a class="btn nav-link" data-page="appearance" href="#appearance">
            <i class="fa-solid fa-palette" aria-hidden="true"></i>
            <span>Appearance</span>
          </a>
        </div>
        <div class="account">
          <button class="btn" id="user-button" aria-expanded="false" aria-controls="user-menu">
            <i class="fa-solid fa-user" aria-hidden="true"></i>
            <span id="user-name">User</span>
            <i class="fa-solid fa-chevron-down account-chevron" aria-hidden="true"></i>
          </button>
          <div id="user-menu" class="dropdown" hidden>
            <button class="btn" data-action="profile">
              <i class="fa-solid fa-user-pen" aria-hidden="true"></i>
              <span>Edit profile</span>
            </button>
            <button class="btn danger-text" data-action="delete-account">
              <i class="fa-solid fa-user-xmark" aria-hidden="true"></i>
              <span>Delete account</span>
            </button>
            <button class="btn" data-action="logout">
              <i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>
              <span>Log out</span>
            </button>
          </div>
        </div>
      </nav>
    </header>
    <main id="dashboard" tabindex="-1" aria-label="Habits">
      <div class="layout">
        <section id="habit-cards" class="habit-cards" aria-label="Habit heatmaps"></section>
        <div class="add-habit">
          <button class="btn primary" id="new-habit">
            <i class="fa-solid fa-plus" aria-hidden="true"></i>
            <span>New habit</span>
          </button>
        </div>
      </div>
    </main>
    <main id="activity-page" hidden aria-labelledby="activity-title">
      <section class="panel activity-panel">
        <div class="page-heading"><h1 id="activity-title">Activity</h1></div>
        <div id="activity-list"></div>
      </section>
    </main>
    <section id="loading" class="panel login" aria-live="polite">
      <i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i>
      <span>Loading</span>
    </section>
    <section id="login" class="panel login" hidden aria-labelledby="auth-title">
      <h1 id="auth-title">Sign in</h1>
      <form id="auth-form">
        <label for="auth-username">Username</label>
        <input
          id="auth-username"
          name="username"
          minlength="3"
          maxlength="40"
          pattern="[A-Za-z0-9_.-]{3,40}"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          required
        />
        <label for="auth-password">Password</label>
        <input
          id="auth-password"
          name="password"
          type="password"
          minlength="8"
          maxlength="72"
          autocomplete="current-password"
          required
        />
        <div id="confirm-field" hidden>
          <label for="auth-confirm">Confirm password</label>
          <input
            id="auth-confirm"
            name="confirmPassword"
            type="password"
            minlength="8"
            maxlength="72"
            autocomplete="new-password"
          />
        </div>
        <p id="auth-error" class="error" role="alert"></p>
        <button id="auth-submit" type="submit" class="btn primary">
          <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
          <span>Sign in</span>
        </button>
        <button id="auth-mode" type="button" class="btn secondary">
          <span>Create account</span>
        </button>
      </form>
    </section>
    <dialog id="editor">
      <form id="editor-form">
        <div class="card-heading">
          <h2 id="editor-title"></h2>
          <button type="button" class="btn icon-button" data-close aria-label="Close">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
        <div id="editor-fields"></div>
        <p id="editor-error" class="error" role="alert"></p>
        <div class="dialog-actions">
          <button type="button" class="btn secondary" data-close>
            <span>Cancel</span>
          </button>
          <button type="submit" class="btn primary" id="save-button">
            <span>Save</span>
          </button>
        </div>
      </form>
    </dialog>

    <main id="appearance" hidden aria-labelledby="appearance-title">
      <section class="panel appearance-panel">
        <div class="page-heading">
          <h1 id="appearance-title">Appearance</h1>
        </div>
        <div id="theme-preview" class="theme-preview" aria-hidden="true">
          <div class="preview-card">
            <div class="preview-line"></div>
            <div class="preview-cells">
              <i></i>
              <i></i>
              <i></i>
              <i></i>
              <i></i>
              <i></i>
              <i></i>
            </div>
          </div>
        </div>
        <h3 class="appearance-label">Palettes</h3>
        <div id="theme-presets" class="theme-presets"></div>
        <h3 class="appearance-label">Customize</h3>
        <div class="theme-colors">
          <label>
            First color
            <input id="theme-a" type="color" value="#c6b5ed" />
          </label>
          <label>
            Second color
            <input id="theme-b" type="color" value="#b6ddd3" />
          </label>
          <label>
            Third color
            <input id="theme-c" type="color" value="#edd4bf" />
          </label>
          <label>
            Heatmap
            <input id="theme-accent" type="color" value="#70609b" />
          </label>
        </div>
        <div class="dialog-actions">
          <button id="theme-reset" type="button" class="btn">
            <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
            <span>Reset</span>
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
