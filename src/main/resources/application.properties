spring.application.name=streaky
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.jpa.open-in-view=false
# Local development defaults to a persistent H2 file. Production supplies a PostgreSQL JDBC URL.
spring.datasource.url=${DB_URL:jdbc:h2:file:./.data/streaky;MODE=PostgreSQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=10000
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.session.jdbc.initialize-schema=never
spring.h2.console.enabled=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=2h
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
server.error.include-message=never
server.error.include-stacktrace=never
app.allowed-origins=${ALLOWED_ORIGINS:}
app.auth-rate-limit.enabled=${AUTH_RATE_LIMIT_ENABLED:true}
